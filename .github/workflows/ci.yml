name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app alembic tests

  test:
    name: Tests (PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: expert
          POSTGRES_PASSWORD: expert
          POSTGRES_DB: expert_listing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U expert -d expert_listing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://expert:expert@localhost:5432/expert_listing_test
      TEST_DATABASE_URL: postgresql+asyncpg://expert:expert@localhost:5432/expert_listing_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - run: uv run pytest -q -rs

  docker:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: GET /health
        run: |
          body=$(curl -fsS http://localhost:8000/health)
          echo "$body"
          test "$body" = '{"status":"ok","database":"ok"}'
      - name: Test database was created
        run: docker compose exec -T db psql -U expert -d expert_listing_test -tAc "SELECT postgis_version()"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
