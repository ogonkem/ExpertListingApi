name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts alembic tests

  test:
    name: Tests (PostGIS)
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: expert
          POSTGRES_PASSWORD: expert
          POSTGRES_DB: expert_listing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U expert -d expert_listing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://expert:expert@localhost:5432/expert_listing_test
      TEST_DATABASE_URL: postgresql+asyncpg://expert:expert@localhost:5432/expert_listing_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: pytest with coverage
        run: uv run pytest -q -rs --cov --cov-report=term-missing --cov-report=xml
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  quickstart:
    # Runs the README's quick start verbatim on a clean checkout, so the documented
    # commands (and the Makefile) are exercised on every push.
    name: README quick start
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: cp .env.example .env
        run: cp .env.example .env
      - name: make up
        run: make up
      - name: make seed
        run: make seed
      - name: /health, /docs and seeded data are served
        run: |
          body=$(curl -fsS http://localhost:8000/health)
          echo "$body"
          test "$body" = '{"status":"ok","database":"ok"}'
          curl -fsS -o /dev/null http://localhost:8000/docs
          total=$(curl -fsS "http://localhost:8000/api/v1/listings?page_size=1" | jq .meta.total)
          echo "seeded listings: $total"
          test "$total" -eq 500
      - name: Test database was created with PostGIS
        run: docker compose exec -T db psql -U expert -d expert_listing_test -tAc "SELECT postgis_version()"
      - name: make test
        run: make test
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
